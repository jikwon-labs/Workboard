[package]
name = "wb-voice"
version = "0.1.1"
edition = "2021"

[dependencies]
# TLS for a wss:// LiveKit (LiveKit Cloud), checked against the roots macOS trusts
livekit = { version = "0.11", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
# the camera: AVFoundation on macOS, Media Foundation on Windows (below)
nokhwa = "0.10"
# call identities (wb_net::identity_member)
wb-net = { path = "../wb-net" }

[target.'cfg(target_os = "macos")'.dependencies]
# screen sharing through ScreenCaptureKit (src/screen.rs)
objc = "0.2"
block = "0.1"
nokhwa = { version = "0.10", features = ["input-avfoundation"] }

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10", features = ["input-msmf"] }

[dev-dependencies]
workboard-server = { path = "../../server", features = ["testing"] }
wb-sync = { path = "../wb-sync" }
serde_json = "1"
