# Builds the Windows app on GitHub's Windows machines. The Mac can't build
# it: the C libraries (ring, libwebrtc) need Microsoft's headers and linker.
# The built workboard.exe is kept with the run as "Workboard-windows".
name: Windows

on:
  push:
    branches: [main, "windows-*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: cargo build --release -p workboard
      - uses: actions/upload-artifact@v4
        with:
          name: Workboard-windows
          path: target/release/workboard.exe
