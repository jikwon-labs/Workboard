[package]
name = "workboard-server"
version = "0.1.1"
edition = "2021"

[dependencies]
wb-sync = { path = "../crates/wb-sync" }
wb-net = { path = "../crates/wb-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
axum = { version = "0.8", features = ["ws", "json"] }
sha2 = "0.11"
chrono = "0.4"
