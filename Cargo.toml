[workspace]
members = [".", "crates/wb-sync", "crates/wb-net", "crates/wb-voice", "server"]
resolver = "2"

[package]
name = "workboard"
version = "0.1.24"
edition = "2021"

[dependencies]
wb-sync = { path = "crates/wb-sync" }
wb-net = { path = "crates/wb-net" }
wb-voice = { path = "crates/wb-voice" }
# eframe's default features, less glow: iOS has no OpenGL for it, so glow is
# turned on below for every other system
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
] }
# with its default features, which eframe's defaults turn on
winit = "0.30"
egui = "0.31"
# font metrics, to line up the Korean font with the system font (setup_fonts)
ab_glyph = "0.2"
# which face of a font collection is Bold (setup_fonts); the version ab_glyph uses
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Slack export .zip files (src/app/slack.rs)
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# the QR code that signs a phone in (src/app/together/phone.rs); drawn by egui
qrcode = { version = "0.14", default-features = false }
# the system fonts, mapped into memory instead of read (setup_fonts); the
# version winit already uses on Linux
memmap2 = "0.9"

[dev-dependencies]
# tests run the real server; it is not part of the app build
workboard-server = { path = "server", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
# test pictures for src/scrub.rs and src/media.rs (macOS builds use ImageIO,
# not these)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
accesskit = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
winit = "0.30"
objc = "0.2"
# blocks for UNUserNotificationCenter callbacks (src/notifier.rs); the version objc 0.2 pairs with
block = "0.1"
raw-window-handle = "0.6"
# the "Quit Workboard?" alert (src/os.rs)
rfd = { version = "0.15", default-features = false }

# Windows: toasts, the taskbar button and the pipe that keeps the app to one
# copy (src/notifier.rs, src/single.rs); the version eframe already pulls in
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
# Windows draws the window with wgpu (Direct3D 12) instead of OpenGL:
# virtual machines and PCs without a graphics driver often have no usable
# OpenGL, and the app then couldn't open its window. With no graphics card
# Direct3D uses Windows' own software renderer (WARP). --opengl for the old
# way (src/main.rs).
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }
# eframe takes wgpu without its default backends, which leaves Windows only
# Vulkan and OpenGL: Direct3D 12 (with the WARP software fallback) is added
# here. The version eframe uses.
wgpu = { version = "24", default-features = false, features = ["dx12"] }
# the file picker (src/media.rs) and the "Quit Workboard?" alert
# (src/os.rs); its default features are for Linux only
rfd = { version = "0.15", default-features = false }

# iPad: the same egui app, drawn with wgpu on Metal (iOS has no OpenGL that
# eframe can use). Experimental: see docs/ipad.md
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }
wgpu = { version = "24", default-features = false, features = ["metal"] }
# the system language (src/i18n.rs), the keyboard's height and the window's
# scene (src/os.rs)
objc = "0.2"
block = "0.1"
raw-window-handle = "0.6"

# the icon inside workboard.exe (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# pictures and the clipboard outside macOS (src/media.rs; macOS uses ImageIO
# and NSPasteboard instead)
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
arboard = "3"

# one-line fix in nokhwa's macOS camera bindings (see third_party/nokhwa-bindings-macos/README.md)
# and Mac text-editing keys in egui (see third_party/egui/PATCHES.md)
[patch.crates-io]
nokhwa-bindings-macos = { path = "third_party/nokhwa-bindings-macos" }
egui = { path = "third_party/egui" }

# objc 0.2's msg_send! expands to `cfg(feature = "cargo-clippy")`, which
# buried real warnings (dead code) under hundreds of these
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.release]
opt-level = 2

# The in-app video player with a real clip (examples/player.rs). An example,
# not tests/: an integration test makes every `cargo test` build the app's
# plain binary as well, a second full compile of the app. `test = true` still
# runs it with `cargo test`; no harness, as AVPlayer needs the main thread.
[[example]]
name = "player"
test = true
harness = false

# Debug builds of this workspace's own crates keep line numbers only (enough
# for panics and backtraces), not full debug info: they rebuild in every new
# worktree, and the full info made that build and every test link slower.
# Only these crates: settings for crates.io crates would change their build
# hashes and throw away the build cache that scripts/wt copies.
[profile.dev.package.workboard]
debug = "line-tables-only"
[profile.dev.package.workboard-server]
debug = "line-tables-only"
[profile.dev.package.wb-sync]
debug = "line-tables-only"
[profile.dev.package.wb-net]
debug = "line-tables-only"
[profile.dev.package.wb-voice]
debug = "line-tables-only"

# password hashing (PBKDF2) runs 100k rounds: keep it quick in test builds too
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
