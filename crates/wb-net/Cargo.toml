[package]
name = "wb-net"
version = "0.1.1"
edition = "2021"

# no doc examples to run: skips an empty doctest pass on every cargo test
[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
sha2 = "0.11"
# wss:// and https:// servers (behind Cloudflare Tunnel): TLS with the roots
# macOS trusts. The same versions livekit already brings in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
wb-sync = { path = "../wb-sync" }
# dates in the task history lines notifications tell (src/notice.rs)
chrono = "0.4"
