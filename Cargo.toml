[workspace]
members = [".", "crates/wb-sync", "crates/wb-net", "crates/wb-voice", "server"]
resolver = "2"

[package]
name = "workboard"
version = "0.1.13"
edition = "2021"

[dependencies]
wb-sync = { path = "crates/wb-sync" }
wb-net = { path = "crates/wb-net" }
wb-voice = { path = "crates/wb-voice" }
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# tests run the real server; it is not part of the app build
workboard-server = { path = "server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
accesskit = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
winit = "0.30"
objc = "0.2"
# blocks for UNUserNotificationCenter callbacks (src/notifier.rs); the version objc 0.2 pairs with
block = "0.1"
raw-window-handle = "0.6"

# one-line fix in nokhwa's macOS camera bindings (see third_party/nokhwa-bindings-macos/README.md)
[patch.crates-io]
nokhwa-bindings-macos = { path = "third_party/nokhwa-bindings-macos" }

[profile.release]
opt-level = 2

[[test]]
name = "player"
harness = false

# password hashing (PBKDF2) runs 100k rounds: keep it quick in test builds too
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
