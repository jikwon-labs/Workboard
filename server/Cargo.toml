[package]
name = "workboard-server"
version = "0.1.1"
edition = "2021"

[dependencies]
wb-sync = { path = "../crates/wb-sync" }
wb-net = { path = "../crates/wb-net" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws", "json"] }
sha2 = "0.11"
hmac = "0.13"
chrono = "0.4"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# invite and password-reset mails (see src/mail.rs); TLS from macOS itself
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "hostname", "builder"] }
# the WebSocket upgrade (see ws_route); the same versions axum uses
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.29", default-features = false }
sha1 = "0.10"
base64 = "0.22"
# Apple push notifications: the ES256 JWT for APNs (see src/push.rs)
ring = "0.17"

[features]
# testing: the test helpers in src/testing.rs (a server on a local port,
# livekit-server, temporary folders) for the tests of this crate, the app
# and wb-voice
testing = []

[dev-dependencies]
# this crate's own tests use its testing helpers
workboard-server = { path = ".", features = ["testing"] }
# a bare connection for protocol tests (the same version wb-net uses)
tungstenite = "0.30"
# a TLS front before the server in tests, like Cloudflare Tunnel's
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
