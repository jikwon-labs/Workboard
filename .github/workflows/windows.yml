# Builds and tests the Windows app on GitHub's Windows machines. The Mac
# can't build it: the C libraries (ring, libwebrtc) need Microsoft's headers
# and linker. The built workboard.exe is kept with the run as
# "Workboard-windows", with a screenshot of it running as "screenshot".
# The same exe packed for the team server, Workboard-<version>-windows-x64.zip
# (version from Cargo.toml), is kept as "Workboard-windows-zip";
# scripts/publish-windows.sh takes it from there to the server's updates/.
name: Windows

on:
  push:
    branches: [main, "windows-*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: cargo build --release -p workboard
      - uses: actions/upload-artifact@v4
        with:
          name: Workboard-windows
          path: target/release/workboard.exe
      - name: Pack the app for the team server
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([0-9.]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $v) { throw "No version in Cargo.toml" }
          $zip = "Workboard-$v-windows-x64.zip"
          Compress-Archive -Path target\release\workboard.exe -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Workboard-windows-zip
          path: ${{ env.ZIP }}
          if-no-files-found: error
      # the machine has no graphics card, like many virtual machines. Try
      # --wgpu (Direct3D, Windows' software renderer) first without failing
      # the run: it doesn't open here yet, and its output says why
      - name: Try the app with --wgpu
        continue-on-error: true
        shell: pwsh
        env:
          WORKBOARD_HOME: ${{ runner.temp }}\wbhome-wgpu
        run: |
          $env:RUST_BACKTRACE = '1'
          $p = Start-Process target\release\workboard.exe -ArgumentList '--wgpu','--screenshot','shot-wgpu.png' -PassThru -RedirectStandardError err-wgpu.txt -RedirectStandardOutput out-wgpu.txt
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "The app didn't finish in 3 minutes" }
          Get-Content err-wgpu.txt, out-wgpu.txt -ErrorAction SilentlyContinue
          Get-Content "$env:WORKBOARD_HOME\startup-error.log" -ErrorAction SilentlyContinue
          if (-not (Test-Path shot-wgpu.png)) { throw "No --wgpu screenshot; the app ended with code $($p.ExitCode)" }
      # then OpenGL, the default: Mesa draws it in software
      - uses: ssciwr/setup-mesa-dist-win@v2
      - name: Start the app and take a screenshot
        shell: pwsh
        env:
          WORKBOARD_HOME: ${{ runner.temp }}\wbhome
        run: |
          $env:RUST_BACKTRACE = '1'
          $p = Start-Process target\release\workboard.exe -ArgumentList '--screenshot','shot.png','--lang','ko' -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "The app didn't finish in 3 minutes" }
          if (-not (Test-Path shot.png)) {
            # why the window didn't open: what the app printed, and src/startup.rs's log
            Get-Content err.txt, out.txt -ErrorAction SilentlyContinue
            Get-ChildItem $env:WORKBOARD_HOME -ErrorAction SilentlyContinue
            Get-Content "$env:WORKBOARD_HOME\startup-error.log" -ErrorAction SilentlyContinue
            throw "No screenshot; the app ended with code $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: shot*.png
          if-no-files-found: ignore

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # a local LiveKit server, so the huddle tests (voice, video, screen)
      # really run instead of printing "skipped"
      - name: Install livekit-server
        shell: pwsh
        run: |
          $v = '1.13.11'
          $dir = Join-Path $env:RUNNER_TEMP 'livekit'
          Invoke-WebRequest "https://github.com/livekit/livekit/releases/download/v$v/livekit_${v}_windows_amd64.zip" -OutFile (Join-Path $env:RUNNER_TEMP 'livekit.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'livekit.zip') -DestinationPath $dir
          & (Join-Path $dir 'livekit-server.exe') --version
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Run the tests
        run: cargo test --workspace
